[workspace]
resolver = "3"
members = ["crates/whizbang-core", "crates/whizbang-eval", "crates/whizbang-testkit", "crates/whizbang"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/markhayden/whizbang"
publish = false

[workspace.dependencies]
whizbang-core = { path = "crates/whizbang-core" }
whizbang-testkit = { path = "crates/whizbang-testkit" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
