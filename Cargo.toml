[workspace]
resolver = "3"
members = ["crates/whizbang-core", "crates/whizbang-backends", "crates/whizbang-eval", "crates/whizbang-rascal", "crates/whizbang-squint", "crates/whizbang-testkit", "crates/whizbang"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/markhayden/whizbang"
publish = false

[workspace.dependencies]
whizbang-core = { path = "crates/whizbang-core" }
whizbang-backends = { path = "crates/whizbang-backends" }
whizbang-rascal = { path = "crates/whizbang-rascal" }
whizbang-squint = { path = "crates/whizbang-squint" }
whizbang-testkit = { path = "crates/whizbang-testkit" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: a double written to JSON is read back as the same double. Without
# it the reader's fast path is wrong in the last bit for about one double of seventeen
# digits in nine, and a run record, which is compared with its own bytes on reading, or a
# binding, whose numbers are part of its identity, would not survive being read. It is on
# for every crate, so that no crate that reads JSON can be the one without it.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
# The reader of the config file (SPEC.md section 4), for the core and for nothing else. One
# crate, the one both old tools read their configs with; it and what it brings (its parser,
# its date type, its spans and `winnow`) are MIT or Apache-2.0 and come from crates.io, which
# `just deny` checks. It reads only: the half that writes TOML is a default feature and is
# off, since whizbang never writes a config. It refuses a key given twice, and it stops at
# a depth of nesting unless `unbounded` is asked for, which it is not.
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
