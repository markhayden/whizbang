name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148,cargo-deny@0.20.2
      - name: Fast tier, advisories, release smoke and secrets scan
        run: just ci
      # About 35 seconds, so on one runner only: a test that sleeps 31 seconds really fails
      # by timeout under this repo's nextest config.
      - name: The 30-second test timeout, for real
        if: matrix.os == 'ubuntu-22.04'
        run: just test-timeout

  ci:
    name: ci
    if: always()
    needs: [check]
    runs-on: ubuntu-22.04
    steps:
      - name: Every platform passed
        run: test "${{ needs.check.result }}" = "success"
