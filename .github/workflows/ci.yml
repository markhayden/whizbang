name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One group per pull request, where a newer run replaces an older one. On main, one
  # group per push: a run there is never cancelled and never waits behind another (a
  # group keeps only one waiting run, so a shared group would drop the middle of three
  # quick pushes), because each run scans only the commits of its own push.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      # The cache holds the pack's pinned Python too (the folder uv installs it in, set by
      # the step that installs it), keyed by the pin and by the pinned tools (uv among
      # them), so that it is downloaded once for each pin and runner and not on every run.
      # The key holds the workspace's Cargo.toml as well, where the profiles are: the
      # cache's own key reads the crates' manifests and Cargo.lock and not that file, so
      # when the profile of the dependencies changed the old key still matched in full, the
      # cache was never saved again, and every run built every dependency afresh. It is
      # saved when a step fails or the job is cancelled too, so that a job stopped at its
      # limit still leaves its build behind.
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ hashFiles('Cargo.toml', 'pack/.python-version', 'scripts/tool-versions.txt') }}
          cache-directories: ${{ runner.temp }}/uv-python
          cache-on-failure: true
      # Pinned to a commit (v2.90.5). Each tool is downloaded from its maker's GitHub
      # releases and checked against the hash the action holds; with no fallback, a tool the
      # action does not list fails the step instead of being built from crates.io.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          fallback: none
          tool: just@1.59.0,cargo-nextest@0.9.148,cargo-deny@0.20.2,uv@0.12.23
      # The Python the pack pins (pack/.python-version), for `just test-pack`. From GitHub's
      # releases only: without the mirror, uv tries its maker's own host first. When the
      # cache above already holds it, nothing is downloaded. The folder it is installed in
      # is the cached one, for this step and every later one.
      - name: The pack's pinned Python
        env:
          UV_NO_CONFIG: "1"
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        run: |
          echo "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR" >>"$GITHUB_ENV"
          uv python install --no-config --no-bin --mirror https://github.com/astral-sh/python-build-standalone/releases/download "$(cat pack/.python-version)"
      # On Linux the tests' scratch folders are made in memory (/dev/shm), not on the
      # runner's disk: the stores the tests open sync every file and folder they publish,
      # and waiting for a disk to finish a sync is nothing a test can observe (on a Mac it
      # was three fifths of the test time). The same calls are made; only the wait is gone. The macOS runner keeps
      # its disk, so a real sync of every kind is still run on every push.
      - name: Scratch folders in memory on Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          df -h /dev/shm
          echo "TMPDIR=/dev/shm" >>"$GITHUB_ENV"
      # `just ci` without the script tests, which take a runner three to six minutes, and
      # without the release smoke, the example that must not compile and the secrets scan:
      # the jobs `scripts` and `release` below run those beside this one, on the same runner.
      - name: Fast tier and advisories, without the script tests, release smoke and secrets scan
        run: just ci-without-scripts
      # 30 seconds, on the runner where git grep on several threads lost matches: the
      # scan's search, on one thread, must give its known output every time.
      - name: The search canary
        if: matrix.os == 'macos-15'
        run: just search-canary
      # About 35 seconds, so on one runner only: a test that sleeps 31 seconds really fails
      # by timeout under this repo's nextest config.
      - name: The 30-second test timeout, for real
        if: matrix.os == 'ubuntu-22.04'
        run: just test-timeout

  # The script tests on each runner, which `check` leaves out: the other half of `just ci`.
  # Set up as `check` is, because some of them run cargo, clippy and cargo-deny: the
  # toolchain, the cache, and the same pinned tools.
  scripts:
    name: scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      # The cache holds the pack's pinned Python too (the folder uv installs it in, set by
      # the step that installs it), keyed by the pin and by the pinned tools (uv among
      # them), so that it is downloaded once for each pin and runner and not on every run.
      # The key holds the workspace's Cargo.toml as well, where the profiles are: the
      # cache's own key reads the crates' manifests and Cargo.lock and not that file, so
      # when the profile of the dependencies changed the old key still matched in full, the
      # cache was never saved again, and every run built every dependency afresh. It is
      # saved when a step fails or the job is cancelled too, so that a job stopped at its
      # limit still leaves its build behind.
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ hashFiles('Cargo.toml', 'pack/.python-version', 'scripts/tool-versions.txt') }}
          cache-directories: ${{ runner.temp }}/uv-python
          cache-on-failure: true
      # Pinned to a commit (v2.90.5). Each tool is downloaded from its maker's GitHub
      # releases and checked against the hash the action holds; with no fallback, a tool the
      # action does not list fails the step instead of being built from crates.io.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          fallback: none
          tool: just@1.59.0,cargo-nextest@0.9.148,cargo-deny@0.20.2,uv@0.12.23
      - name: The script tests, after the crates they read are in cargo's home
        run: just ci-scripts

  # The release build and what follows it on each runner, which `check` leaves out: a
  # part of `just ci`. In `check` the release build took the macOS job past its
  # limit (13 to 15 minutes of 15). Set up as `check` is: the toolchain, the cache (its
  # own, under this job's name, with the release build's dependencies) and the same
  # pinned tools.
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      # The cache holds the pack's pinned Python too (the folder uv installs it in, set by
      # the step that installs it), keyed by the pin and by the pinned tools (uv among
      # them), so that it is downloaded once for each pin and runner and not on every run.
      # The key holds the workspace's Cargo.toml as well, where the profiles are: the
      # cache's own key reads the crates' manifests and Cargo.lock and not that file, so
      # when the profile of the dependencies changed the old key still matched in full, the
      # cache was never saved again, and every run built every dependency afresh. It is
      # saved when a step fails or the job is cancelled too, so that a job stopped at its
      # limit still leaves its build behind.
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ hashFiles('Cargo.toml', 'pack/.python-version', 'scripts/tool-versions.txt') }}
          cache-directories: ${{ runner.temp }}/uv-python
          cache-on-failure: true
      # Pinned to a commit (v2.90.5). Each tool is downloaded from its maker's GitHub
      # releases and checked against the hash the action holds; with no fallback, a tool the
      # action does not list fails the step instead of being built from crates.io.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          fallback: none
          tool: just@1.59.0,cargo-nextest@0.9.148,cargo-deny@0.20.2,uv@0.12.23
      - name: Release smoke, the example that must not compile, and the secrets scan
        run: just ci-release

  # The secrets scan and the attribution check over every commit, in a job of its own
  # beside the others: on a branch that adds many files it takes minutes, and in the
  # `check` job it took that job past its limit. One runner is enough: it reads commits,
  # not a build.
  secrets:
    name: secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every commit, not only the final tree: a secret added and then deleted, or a commit
      # made where the hooks do not run, is still caught. On a pull request, base..head; on
      # main, the commits of the push. A pull request is checked by the base branch's copy
      # of the scan, so it cannot pass by changing the scan; the head's copy is used only
      # when the base has none that can scan a range.
      - name: Secrets scan and attribution check over every commit
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scan=scripts/scan.sh
          if [ "$EVENT" = pull_request ] &&
            git show "$BASE":scripts/scan.sh >"$RUNNER_TEMP/scan.sh" 2>/dev/null &&
            grep -q -e '--range' "$RUNNER_TEMP/scan.sh"; then
            scan="$RUNNER_TEMP/scan.sh"
          fi
          bash "$scan" --secrets-only --range "$BASE" "$HEAD"

  ci:
    name: ci
    if: always()
    needs: [check, scripts, release, secrets]
    runs-on: ubuntu-22.04
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.scripts.result }}" = "success"
          test "${{ needs.release.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
