# The bound price of one generated picture for each generator the set builder uses (plan mE,
# task B1, item 7): what the spend guard charges each request, each retry included, before
# it is sent. The orchestrator reads each from the provider's own price page before the first
# live build and writes it here with the date it was read, as
#
#   [generator.fal]
#   usd_per_picture = 0.01
#   checked_on = 2026-12-01
#
# A generator with no row here cannot be used live: its requests are refused before anything
# is sent. None is written yet; no price here is a guess.
