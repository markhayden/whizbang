# The dry run's plan of a blind source-fidelity set (scripts/tests/test-sets.sh). A real
# blind plan lives in owner storage and is never in a repository: the test copies this one
# out of the repository before it builds, and the builder refuses it where it is. Made up for
# the test.
[set]
id = "source-fidelity/dry-run-blind-v1"
use_case = "source-fidelity"
split = "blind"
licence = "CC-BY-4.0"
images_repo = "github.com/markhayden/wafflery-evalsets"
rules = { base = "source-fidelity", version = 1 }

[[family]]
id = "orchard-gate"
generator = "fake"
description = "an orchard with a green gate and a stone wall"
brief = "Restyle the scene; keep the structure and every named subject."
source = { prompt = "An orchard behind a green gate in a stone wall.", seed = 1001, size = 128 }
protected = ["the green gate"]

[[family.item]]
id = "orchard-gate-grade"
op = { kind = "grade", warmth = 0.08 }

[[family.item]]
id = "orchard-gate-no-gate"
op = { kind = "edit", prompt = "Take the gate away. Change nothing else.", removes = "green gate" }
