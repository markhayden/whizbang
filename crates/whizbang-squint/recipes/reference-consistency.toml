# The use case reference-consistency as a recipe (plan m3, task Q1, item 1): `details` measures what
# can be measured before the judge looks, each tool a nested call of its own run, and hands
# on the images it made and what each tool's run handed back; the judge's step is `check`,
# the loop under the use case's rules (`rules/reference-consistency.toml`, squint's), told what was
# measured first and offered the tools it may call.
#
# As shipped the recipe is the control arm of the gate of details first, whole (plan m4, task
# A1; docs/results/m3-gates.md, which rejected details first): nothing is measured first, so
# `details` starts no tool and hands on nothing; the judge is offered `view` and `align`; and
# a call of `align` is answered with its pictures alone. A run brings details first back
# whole, as the gate's arm F was, with --set details.details=first, --set
# judge.tools=view,align,resize and --set judge.projection=full, which is what
# `whizbang squint check --details first` states.
#
# Ported from squint's run of a use case (`crates/squint-core/src/run.rs` and
# `crates/squint-core/rules/reference-consistency.toml` at the commit `docs/sources.toml` pins), with the
# details `check` measured first since plan 2C's task A2 (ADR 0029) as a step of their own.
# The second look is off unless a run sets it (--set judge.second_look=on), as `check`'s
# own default is (plan m3, task U1); whether this recipe turns it on is its gate's to decide.
version = 1
name = "reference-consistency"
purpose = "Checks whether a subject of the references appears faithfully: the judge looks, and calls view and align as it needs."
use = "To hold a picture to one to eight references of the same subject."
use_case = "reference-consistency"

[inputs]
images = { type = "Image", many = true }
job = { type = "Text" }
judge = { type = "Text", optional = true }

[[step]]
id = "details"
op = "details"
inputs = { images = "inputs.images" }
use_case = "reference-consistency"
job = "inputs.job"
details = "none"
detail = "align"

[[step]]
id = "judge"
op = "check"
inputs = { images = "inputs.images", measured_images = "details.images" }
use_case = "reference-consistency"
job = "inputs.job"
judge = "inputs.judge"
measured = "details.measurements"
tools = "view,align"
projection = "visual_only"
second_look = "off"
max_output_tokens = 2048
