[package]
name = "whizbang-squint"
description = "Squint's rules, checklist, judge loop and Rust tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
whizbang-core.workspace = true
# The arguments of a judge's tool call, and a tool's schema, are JSON values.
serde_json.workspace = true
# Squint's rule files and job files are TOML (plan 2C, task A1); a job travels as JSON.
serde.workspace = true
toml.workspace = true
# Encoding a crop as a PNG. The file's bytes are part of the image artifact's identity
# (ADR 0002), so what writes them is pinned exactly: a crop is written by the core's one
# encoder (`whizbang_core::identity::encode`), whose manifest pins `image`, `png` and the
# compressor `png` calls at its setting, `fdeflate`. The vectors in `tests/it/vectors.rs`
# fail when an encoder writes a file differently. An encoder change changes every crop's
# file digest, and so its artifact's identity; its pixel digest and its binding stay.
# Nothing here decodes: an image is read through the core's `identify` alone (ADR 0001).
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# The replay of the baseline checks a submission against squint's JSON Schema with the
# validator squint checked it with, at the version its lock file pins, so that a refusal
# reads as squint's did, word for word (plan 2C, task E2; `crate::replay`). It adds 60
# crates to the lock file (88 in its tree, counting those already there), which the owner
# decided on 2026-11-19 stay out of the shipped binary: it is optional, behind the feature
# `baseline-replay` (ADR 0034).
jsonschema = { version = "=0.60.2", default-features = false, optional = true }

[features]
# The replay of the baseline (`crate::replay`) and its validator. Off by default: the
# binary is built without it unless asked (`cargo build --release -p whizbang --features
# baseline-replay`); the tests turn it on by this crate's development dependency on itself.
baseline-replay = ["dep:jsonschema"]

[dev-dependencies]
whizbang-testkit.workspace = true
# The scene the perspective view is held against, evaluated alike on every machine.
libm = "=0.2.16"
# This crate itself, with the replay, for its own tests.
whizbang-squint = { path = ".", features = ["baseline-replay"] }

[lints]
workspace = true
