[package]
name = "whizbang-squint"
description = "Squint's rules, checklist, judge loop and Rust tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
whizbang-core.workspace = true
# Encoding a crop as a PNG. The file's bytes are part of the image artifact's identity
# (ADR 0002), so what writes them is pinned exactly, to the version the core decodes with;
# the vectors in `tests/it/vectors.rs` fail when an encoder writes a file differently.
# Nothing here decodes: an image is read through the core's `identify` alone (ADR 0001).
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
