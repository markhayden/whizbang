[package]
name = "whizbang"
description = "One toolkit for working on images with models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "whizbang"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
whizbang-backends.workspace = true
whizbang-core.workspace = true
whizbang-rascal.workspace = true
whizbang-squint.workspace = true
# The MCP server over stdio (plan 2C, task M1; ADR 0031).
whizbang-serve.workspace = true
# Evaluation sets and matrices (plan 2C, task E1).
whizbang-eval = { path = "../whizbang-eval" }
clap.workspace = true
# The terminal's signals for `whizbang play` alone, through the safe iterator, so that
# Ctrl-C cancels and accounts for the runs going and lets the store go (plan m5, task H1,
# open question 1, approved by the owner; ADR 0041). With `signal-hook-registry`, both
# MIT or Apache-2.0; `libc` is in the lock file already.
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
serde.workspace = true
serde_json.workspace = true
# A tool file's declaration (plan 2C, task X1; ADR 0032), read as squint reads a job.
toml.workspace = true
# Writing an imported picture again as a PNG of its pixels alone (`store import
# --picture`), at the version the core decodes with and `whizbang-squint` encodes with;
# and squint's digest of a picture's decoded samples, which the baseline gate recomputes
# (`eval baseline`), for the PNG and JPEG pictures of the sets, as the core decodes them.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[features]
# What only a test may build: `OneWorker::starting`, a one worker started from what a
# test hands it, and `Launch::testing`. Only the tests' builds turn it on, by this
# crate's development dependency on itself; `just smoke` and a release build
# (`cargo build --release -p whizbang`) build the binary without it, so no source of
# the binary that names either compiles there (plan 1C, the review of task P6a).
fakes = ["whizbang-backends/fakes"]
# The baseline gate's replay (`whizbang eval baseline`), and with it the JSON Schema validator
# squint judged submissions with and the 60 crates it adds to the lock file. The owner decided on 2026-11-19
# that they stay out of the shipped binary (ADR 0034): off by default, built with
# `cargo build --release -p whizbang --features baseline-replay`; the tests turn it on below.
baseline-replay = ["whizbang-squint/baseline-replay"]

[dev-dependencies]
whizbang-testkit.workspace = true
# Pictures to import, as a PNG and a JPEG, for the tests of `store import --picture`.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# This crate itself, with the features `fakes` and `baseline-replay`, for its own tests.
whizbang = { path = ".", features = ["fakes", "baseline-replay"] }

[lints]
workspace = true
