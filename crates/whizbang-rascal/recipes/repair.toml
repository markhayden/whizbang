# Repair a scratch or a tear: a stroke a person drew along it, tightened to the defect's own
# edges, feathered, and filled.
#
# Ported from rascal's `crates/rascal-mask/recipes/repair.toml` at the commit
# `docs/sources.toml` pins, with what this build's actions take: the recipe ends in
# `fill`, which paints the mask with the configured filler and hands back the composite and
# the mask rebound onto it (plan m3, task O4, item 1); and rascal's grey rendering is left
# to the action `render`.
version = 1
name = "repair"
purpose = "Repairs a scratch or a tear along a stroke: the stroke tightened to the defect's edges, feathered, then filled."
use = "To repaint a thin defect a person marked roughly with a brush."
use_case = "repair"

[inputs]
image = { type = "Image" }
stroke = { type = "Location" }
backend = { type = "Text", optional = true }

[[step]]
id = "tighten"
op = "tighten"
inputs = { stroke = "inputs.stroke", image = "inputs.image" }
constants = "tighten-v1"

[[step]]
id = "feather"
op = "feather"
inputs = { mask = "tighten.mask" }
sigma_px = 2.0

[[step]]
id = "fill"
op = "fill"
inputs = { image = "inputs.image", mask = "feather.mask" }
backend = "inputs.backend"

[outputs]
image = "fill.image"
mask = "fill.mask"
