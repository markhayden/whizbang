# Remove a thing at a location: the location (a box, a polygon or a stroke) becomes the
# core, grown a little and further downward for its shadow, closed, small holes filled,
# kept off anything protected, feathered, and filled.
#
# Ported from rascal's `crates/rascal-mask/recipes/remove.toml` at the commit
# `docs/sources.toml` pins, with what this build's actions take: `rasterize` takes the
# location on the image; the recipe ends in `fill`, which paints the mask with the
# configured filler and hands back the composite and the mask rebound onto it (plan m3,
# task O1, item 3); and rascal's grey rendering is left to the action `render`.
version = 1
name = "remove"
purpose = "Removes the thing at a location: the mask grown, closed, plugged, kept off protect and feathered, then filled."
use = "To remove a thing whose place you know, as a box, a polygon or a stroke; give protect to keep what the mask would reach."
use_case = "remove"

[inputs]
image = { type = "Image" }
location = { type = "Location" }
protect = { type = "Mask", optional = true }
backend = { type = "Text", optional = true }

[[step]]
id = "rasterize"
op = "rasterize"
inputs = { location = "inputs.location", image = "inputs.image" }
use_case = "remove"

[[step]]
id = "grow"
op = "grow"
inputs = { mask = "rasterize.mask" }
px = 4.0
down_px = 12.0

[[step]]
id = "close"
op = "close"
inputs = { mask = "grow.mask" }
radius_px = 3.0

[[step]]
id = "plug"
op = "plug"
inputs = { mask = "close.mask" }
max_share = 0.1

[[step]]
id = "subtract"
op = "subtract"
inputs = { mask = "plug.mask", subtract = "inputs.protect" }
grow_px = 2.0

[[step]]
id = "feather"
op = "feather"
inputs = { mask = "subtract.mask" }
sigma_px = 4.0

[[step]]
id = "fill"
op = "fill"
inputs = { image = "inputs.image", mask = "feather.mask" }
backend = "inputs.backend"

[outputs]
image = "fill.image"
mask = "fill.mask"
