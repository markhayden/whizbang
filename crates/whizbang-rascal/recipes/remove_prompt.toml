# Remove what a phrase names: `segment` finds the instances, `select` takes every one as the
# core, then the shaping of rascal's `remove`: grown a little and further downward for the
# shadow, closed, small holes filled, kept off anything protected, feathered; then `fill`
# paints what the mask covers and pastes it (plan m3, task F1, item 6). `--until feather`
# hands back the mask alone, and asks no filler.
#
# Ported from rascal's `crates/rascal-mask/recipes/remove-prompt.toml` at the commit
# `docs/sources.toml` pins, with what this build's actions take: `segment` takes the phrase
# as its `query` and the segmenter as its `backend` (rascal's `model`); `select` takes the
# instance masks at `mask` (rascal's planes); and rascal's grey rendering is left to the
# action `render`, which a caller runs on the mask.
version = 1
name = "remove_prompt"
purpose = "Removes what a phrase names: its mask found, grown, closed, plugged, kept off protect and feathered, then filled."
use = "To remove a thing you can name in words from a picture; give protect to keep what the mask would reach; until feather gives the mask alone."
use_case = "remove"

[inputs]
image = { type = "Image" }
prompt = { type = "Text" }
backend = { type = "Text", optional = true }
protect = { type = "Mask", optional = true }
filler = { type = "Text", optional = true }

[[step]]
id = "segment"
op = "segment"
inputs = { image = "inputs.image" }
query = "inputs.prompt"
backend = "inputs.backend"
max_instances = 8

[[step]]
id = "select"
op = "select"
inputs = { mask = "segment.mask" }

[[step]]
id = "grow"
op = "grow"
inputs = { mask = "select.mask" }
px = 4.0
down_px = 12.0

[[step]]
id = "close"
op = "close"
inputs = { mask = "grow.mask" }
radius_px = 3.0

[[step]]
id = "plug"
op = "plug"
inputs = { mask = "close.mask" }
max_share = 0.1

[[step]]
id = "subtract"
op = "subtract"
inputs = { mask = "plug.mask", subtract = "inputs.protect" }
grow_px = 2.0

[[step]]
id = "feather"
op = "feather"
inputs = { mask = "subtract.mask" }
sigma_px = 4.0

[[step]]
id = "fill"
op = "fill"
inputs = { image = "inputs.image", mask = "feather.mask" }
backend = "inputs.filler"

[outputs]
image = "fill.image"
mask = "fill.mask"
