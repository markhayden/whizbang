# Heal the wrap edge of a complete panorama: cut makes the canvas whose middle column is
# the wrap edge; line names it; fan measures the band; profile makes the mask; ramp
# prescribes the tone step; apply performs it on the canvas, the working image, and
# rebinds the mask onto it; fill paints the working image through that mask; put writes
# the canvas back.
#
# Ported from rascal's `crates/rascal-mask/recipes/seam.toml` and the graph of `heal_once`
# in `crates/rascal-mask/src/heal.rs` at the commit `docs/sources.toml` pins (plan m3,
# task O3): rascal's recipe ended at the mask and `heal` took it from there; here the
# recipe runs the heal's apply, fill and put too. `line` gives the column as a share of
# the canvas's width, rascal's unit, since the canvas's width depends on the panorama's.
# `fan-v3` is the default set, as at rascal's tag; rascal's grey rendering is left to the
# action `render`.
version = 1
name = "seam"
purpose = "Heals the wrap edge of a panorama: the band along the seam measured, its tone step ramped, then filled and put back."
use = "On a complete panorama whose left and right edges do not meet; give backend to choose the filler."
use_case = "seam"
projection = "equirectangular"

[inputs]
image = { type = "Image" }
backend = { type = "Text", optional = true }

[[step]]
id = "cut"
op = "cut"
inputs = { image = "inputs.image" }
strip = 0.07

[[step]]
id = "line"
op = "line"
inputs = { image = "cut.image" }
column_share = 0.5
width_px = 2.0

[[step]]
id = "fan"
op = "fan"
inputs = { image = "cut.image", line = "line.location" }
constants = "fan-v3"

[[step]]
id = "band"
op = "profile"
inputs = { band = "fan.band" }
constants = "profile-v1"

[[step]]
id = "ramp"
op = "ramp"
inputs = { image = "cut.image", mask = "band.mask" }
constants = "ramp-v1"

[[step]]
id = "apply"
op = "apply"
inputs = { image = "cut.image", mask = "ramp.mask" }

[[step]]
id = "fill"
op = "fill"
inputs = { image = "apply.image", mask = "apply.mask" }
backend = "inputs.backend"

[[step]]
id = "put"
op = "put"
inputs = { image = "inputs.image", canvas = "fill.image", plan = "cut.plan", mask = "fill.mask" }

[outputs]
image = "put.image"
mask = "ramp.mask"
