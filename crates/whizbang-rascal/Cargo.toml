[package]
name = "whizbang-rascal"
description = "Rascal's operations and tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
whizbang-core.workspace = true
# Each operation's command flags live beside the operation (plan m3, "Shared files").
clap.workspace = true
# Rascal's constant sets are TOML files, copied byte for byte (`constants`).
toml.workspace = true

[dev-dependencies]
# The tests of `segment` and `render` paint and read their pictures with it, at the version
# the core decodes with. A rendering's file is written by the core's one encoder.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
whizbang-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
