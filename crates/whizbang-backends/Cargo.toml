[package]
name = "whizbang-backends"
description = "Implementations of the capability interfaces, and model installations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
whizbang-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# The hash of a model's file, taken as its pieces arrive: a file is never held whole.
sha2.workspace = true
# The download client's TLS, and the roots it trusts, compiled in (ADR 0024).
rustls.workspace = true
webpki-roots.workspace = true
# Scaling a picture to the side fal's filler is sent at, and its answer back: the version
# and the features the core decodes with, so the lock gains nothing.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[features]
# What only a test may build: `Launch::testing`, a launch of the pack's fakes. Only the
# tests' builds turn it on, by the development dependencies below and in the crate
# `whizbang`; the binary `just smoke` builds (`-p whizbang`, no development
# dependency) is built without it (plan 1C, the review of task P6a).
fakes = []

[dev-dependencies]
whizbang-testkit.workspace = true
# This crate itself, with the feature `fakes`, for its own tests.
whizbang-backends = { path = ".", features = ["fakes"] }

[lints]
workspace = true
