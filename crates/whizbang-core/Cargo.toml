[package]
name = "whizbang-core"
description = "Identities, artifacts, the store, config, spend and the execution contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
# Decoding, to reach an image's canonical pixels. PNG and JPEG are what the old tools read.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Powers that round the same on every machine, for the colour conversion.
libm = "0.2"
serde.workspace = true
sha2 = "0.11"

[dev-dependencies]
# A second lossless container, for the tests only: the same pixels in PNG and in BMP.
image = { version = "0.25", default-features = false, features = ["bmp"] }
serde_json.workspace = true

[lints]
workspace = true
