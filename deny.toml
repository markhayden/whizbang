# cargo-deny configuration. `just deny` (part of `just check`) checks licences, bans and
# sources, which work offline; `just deny-advisories` needs the network and runs in `just ci`.
[graph]
all-features = true

# Licences a dependency may carry; anything else fails. The allowlist is the one the old
# repos used.
[licenses]
# The list is kept whole from the start; an entry no dependency uses yet is not a finding.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",   # file-level copyleft; acceptable for a binary that does not modify such files
  "CDLA-Permissive-2.0",   # Mozilla's root-certificate data
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path-only dependency between workspace crates has no version and counts as a wildcard.
allow-wildcard-paths = true

# Crates come from crates.io only: any other registry, and any git source, fails.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
