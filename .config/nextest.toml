# nextest configuration (SPEC.md section 13).
#
# The default profile is the fast tier. A test still running after 30 seconds is killed and
# reported as a failure by timeout: `period` is when nextest calls a test slow, and
# `terminate-after = 1` ends it at the first such period.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

# One result file per run, read by scripts/timing.sh for the seconds-per-suite table.
[profile.default.junit]
path = "junit.xml"

# The tests that crash a store before every step of something, or refuse every step of
# the file system in turn, and try every way the disk can lose what was not yet durable,
# each do thousands of small file operations. Run all beside each other inside a full
# check on a busy machine they took 17 to 19 seconds each against the limit of 30, and
# 2 to 5 alone. They run two at a time, so that they hardly compete with each other;
# every other test still runs beside them.
#
# Two and not one: one at a time, their seconds added up to the whole test time (116 of
# 117 seconds on a Linux runner), which has a limit of its own (scripts/timing.sh). Two
# at a time took the test time on a 16-core machine from 78 seconds to 56 with the
# slowest sweep at 13; three at a time gained 5 seconds more and took the slowest sweep
# from 15 seconds to 18, so it stays at two. The two sweeps that start with the run, when
# every thread is busy, are the slow ones.
#
# A new sweep joins by its name: `a_crash_at_any_event`, `crashed_inside_its`,
# `refused_and_then_a_crash` or `each_step_of_the_file_system_refused`. The thousand
# publications of the store's buckets (plan m6, task S1) join them too: 3 seconds alone,
# and past 30 beside every other test inside a full check.
#
# In CI the group runs in jobs of its own, `sweeps (<runner>)`, beside `check`, each part
# under the limit of 300 seconds; `just check` still runs every test at once. The split
# is named once, in scripts/timing.sh (`--part`), as `group(crash-sweeps)` and one test of
# squint: a profile's default filter may not name a group.
[test-groups]
crash-sweeps = { max-threads = 2 }
pack-workers = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(a_crash_inside_the_admission_step) | test(a_crash_at_any_event) | test(crashed_inside_its) | test(random_runs_of_publications) | test(a_thousand_publications) | test(refused_and_then_a_crash) | test(each_step_of_the_file_system_refused)'
test-group = 'crash-sweeps'

# The tests that start the pack's worker, a Python process each, through the test kit's
# guard (docs/plans/m1c-local-pack.md, "Rules", "Worker processes"): two at a time, so
# that at most two workers live at once. A test file of the pack's supervisor joins by
# its module (task P3a: `pack::worker::`; task P3b: `pack::conformance::`; task P4:
# `pack::queue::`; task P5b: `pack::removal::`), and so does
# the file of `whizbang setup`, whose check that the worker says hello starts one (task
# Y1: `setup::`), the binary's file of the kind `pack`, whose tests are its module's
# own with no module below (task P6a: `pack::` and a test's name), and every test that
# starts the tool worker, which names a tool file or the tool worker (plan 2C, task X1),
# and every test of the kind `remote`, which starts the pack's front, a Python process
# whose workers are Python processes too (plan m6, task R1: `remote::`). The filter names no
# package: this file is also read in a workspace of another crate
# (scripts/tests/test-timeout.sh), where a package that is not there is an error.
[[profile.default.overrides]]
filter = 'test(/^pack::(worker|conformance|queue|removal)::/) | test(/^pack::[a-z0-9_]+$/) | test(/^setup::/) | test(/tool_file|tool_worker/) | test(/^remote::/)'
test-group = 'pack-workers'

# The model tier (docs/plans/m1c-local-pack.md, task R2b): the tests that load a real model,
# run by `just test-models` (scripts/test-models.sh), never in the fast tier or CI. A load
# has 120 seconds and a request 60 (the supervisor's limits); a test is ended at 5 minutes.
[profile.model-tier]
slow-timeout = { period = "300s", terminate-after = 1 }

# One result file per run, as the default profile writes: the local leg of a release
# (scripts/prerelease-local.sh; plan m4, task R2, item 4) reads from it which tests ran,
# and that none failed or timed out.
[profile.model-tier.junit]
path = "junit.xml"

# The parity test (plan 1D, task V1) asks three pictures three times on the GPU and three on
# the CPU, of SAM 3 and of Tiny: 36 requests and four loads, SAM 3's CPU ones 5 to 10
# seconds each. It is ended at 10 minutes.
[[profile.model-tier.overrides]]
filter = 'test(/^parity::/)'
slow-timeout = { period = "600s", terminate-after = 1 }
