# The format round of plan e1, task F2: submission v1 against v2 under arm C, on the ten dev
# sets (the five use cases' dev sets and their adversarial sets, 110 items), under the three
# small judges, twice: 110 x 3 x 2 x 2 = 1,320 cells, 660 decisions an arm. Each arm names
# its format, so no cell's identity depends on the binary's default (plan e1, F1, item 1).
# The judges are named as labs/e-loop/config.toml names them (a backend's name holds no
# dot). Scored by `whizbang eval judges --mode arms --rule submission/1`, with v1 the
# control. Run by the orchestrator on the owner's Mac; the commands are in
# docs/results/e-submission.md, "How it is run".
[matrix]
name = "e-submission"
sets = [
  "source-fidelity/scenes-v1",
  "reference-consistency/pets-v1",
  "reality-checks/people-v1",
  "brief-compliance/stills-v1",
  "product-fidelity/packshots-v1",
  "source-fidelity/adversarial-v1",
  "reference-consistency/adversarial-v1",
  "reality-checks/adversarial-v1",
  "brief-compliance/adversarial-v1",
  "product-fidelity/adversarial-v1",
]
arms = ["C;submission=v1", "C;submission=v2"]
repetitions = 2
concurrency = 2

[[matrix.judges]]
backend = "claude-haiku-5-5"
model = "claude-haiku-5-5"

[[matrix.judges]]
backend = "gemini-3-8-flash"
model = "gemini-3.8-flash"

[[matrix.judges]]
backend = "gpt-6-1-terra"
model = "gpt-6.1-terra"
