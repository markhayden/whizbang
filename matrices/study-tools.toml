# Ported from squint's evalsets/matrix/study-tools.toml (squint, cc4b9ac3e2a9a3fbfd32a6588e5d700988e36b63).
# Squint's arm D_<tool> is C+<tool> here: the control and the one tool under test. The judge is
# the config's backend of that name, which must be of the model named. outline and regions are
# tools whizbang does not have yet (task X1), so the runner refuses this matrix until it does.
[matrix]
name = "study-tools-2026-11"
sets = ["source-fidelity/blind-v3"]
arms = ["C", "C+outline", "C+regions"]
repetitions = 1

[[matrix.judges]]
backend = "haiku"
model = "claude-haiku-5-5"

[[matrix.judges]]
backend = "sonnet"
model = "claude-sonnet-5-5"

[[matrix.judges]]
backend = "opus"
model = "claude-opus-5-5"

[[matrix.judges]]
backend = "flash"
model = "gemini-3.8-flash"

[[matrix.judges]]
backend = "terra"
model = "gpt-6.1-terra"

[[matrix.judges]]
backend = "sol"
model = "gpt-6.1-sol"
