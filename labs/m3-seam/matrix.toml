# The matrix of the lab `m3-seam` (plan m3, task L3, item 4; the protocol beside it says
# what is compared). Each picture of the corpus through the shipped `seam` recipe under two
# constant sets of its step `fan`: `fan-v3`, the recipe's default, named so the matrix says
# what it runs, and `fan-thin-v1`. Neither arm names its filler: each fill goes to the
# config's default fill backend, which for this round is fal's `bria-eraser`, resolved into
# every cell's identity. Run (no path of the owner's is written here):
#   whizbang lab corpus verify --manifest labs/m3-seam/corpus.toml --root <the pictures>
#   whizbang lab run --matrix labs/m3-seam/matrix.toml --corpus <the pictures> --config <config>
#   whizbang lab pairs --matrix labs/m3-seam/matrix.toml --corpus <the pictures> --config <config>
#   whizbang lab decode --protocol labs/m3-seam/protocol.toml --assignment <out>/assignment.json --picks <picks.json>
