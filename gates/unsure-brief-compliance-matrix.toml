# The matrix of the gate of the second look for brief-compliance (plan m3, task U1, item 6; gate file
# `unsure-brief-compliance.toml` beside it): arm F against F with the second look for brief-compliance, on its dev
# set brief-compliance/stills-v1, under claude-haiku-5-5 three times and gemini-3.8-flash and gpt-6.1-terra
# once each. Each judge is the config's backend of that name, of the model named. Run by the
# orchestrator on the owner's Mac.
[matrix]
name = "gate-unsure-brief-compliance"
sets = ["brief-compliance/stills-v1"]
arms = ["F", { arm = "F", second_look = [{ look = "on", use_cases = ["brief-compliance"] }] }]
repetitions = 1
concurrency = 4

[[matrix.judges]]
backend = "haiku"
model = "claude-haiku-5-5"
repetitions = 3

[[matrix.judges]]
backend = "flash"
model = "gemini-3.8-flash"

[[matrix.judges]]
backend = "terra"
model = "gpt-6.1-terra"
