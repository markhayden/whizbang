# The matrix of the gate of details first (plan m3, task G1, item 3; gate file
# `details-first.toml` beside it): arm F, the details of each pair measured first, against arm
# C, squint's control, on the five dev sets (100 items, 25 families), under claude-haiku-5-5
# three times and gemini-3.8-flash and gpt-6.1-terra once each. Each judge is the config's
# backend of that name, of the model named. Run by the orchestrator on the owner's Mac.
[matrix]
name = "gate-details-first"
sets = [
  "source-fidelity/scenes-v1",
  "reference-consistency/pets-v1",
  "reality-checks/people-v1",
  "brief-compliance/stills-v1",
  "product-fidelity/packshots-v1",
]
arms = ["C", "F"]
repetitions = 1
concurrency = 4

[[matrix.judges]]
backend = "haiku"
model = "claude-haiku-5-5"
repetitions = 3

[[matrix.judges]]
backend = "flash"
model = "gemini-3.8-flash"

[[matrix.judges]]
backend = "terra"
model = "gpt-6.1-terra"
